<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020b12">
  <title>BladeMaster</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020b12}
    body{display:flex;align-items:center;justify-content:center}iframe{display:block;flex-shrink:0;border:0;width:100%;height:100%;background:#020b12;transform-origin:center}
  </style>
</head>
<body><iframe src="./game/index.html" title="BladeMaster game" allow="autoplay;fullscreen" allowfullscreen></iframe>
<script>
  function fitGame(){const frame=document.querySelector('iframe'),desktop=matchMedia('(min-width:600px) and (hover:hover)').matches;
    frame.style.width=desktop?'390px':'100%';frame.style.height=desktop?'844px':'100%';
    frame.style.transform=desktop?'scale('+Math.min(1,innerWidth/390,innerHeight/844)+')':'none';}
  addEventListener('resize',fitGame,{passive:true});fitGame();
</script></body>
</html>
